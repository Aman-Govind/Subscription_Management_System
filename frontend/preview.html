    function setLoginRole(roleKey) {
      const p = PRESET_USERS[roleKey];
      if (p) {
        state.selectedLoginRole = roleKey;
        state.loginEmail = p.email;
        state.loginPassword = 'password123';
        state.loginError = '';
        render();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      state.isSubmitting = true;
      state.loginError = '';
      render();

      setTimeout(() => {
        const assignedRole = state.selectedLoginRole;
        const preset = PRESET_USERS[assignedRole];
        const profile = {
          name: state.loginEmail.split('@')[0].replace('.', ' ').replace(/\b\w/g, l => l.toUpperCase()),
          email: state.loginEmail,
          role: assignedRole,
          company: preset ? preset.company : 'Brightloop Software',
          department: preset ? preset.department : 'General Access',
          allowedRoutes: assignedRole === 'customer' 
            ? ['dashboard', 'subscriptions', 'invoices']
            : ['dashboard', 'products', 'subscriptions', 'invoices', 'payments']
        };
        const token = 'jwt_token_' + assignedRole + '_' + Date.now();

        localStorage.setItem('token', token);
        localStorage.setItem('user_role', assignedRole);
        localStorage.setItem('user_profile', JSON.stringify(profile));

        state.token = token;
        state.role = assignedRole;
        state.user = profile;
        state.isSubmitting = false;
        state.activeTab = 'dashboard';
        render();
      }, 200);
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user_role');
      localStorage.removeItem('user_profile');

      state.token = null;
      state.role = null;
      state.user = null;
      state.activeTab = 'dashboard';
      render();
    }

    function setActiveTab(tab) {
      if (state.user && !state.user.allowedRoutes.includes(tab)) {
        alert('Access Restricted: Your assigned role (' + state.role + ') does not have access to this module.');
        return;
      }
      state.activeTab = tab;
      render();
    }

      SUBSCRIPTIONS_DATA = SUBSCRIPTIONS_DATA.map(s => {
        if (s.id === subId) {
          return { ...s, status: newStatus };
        }
        return s;
      });
      state.pipelineSubId = null;
      render();
    }

    function generateDueInvoices() {
      const activeSubs = SUBSCRIPTIONS_DATA.filter(s => s.status === 'active');
      let createdCount = 0;

      activeSubs.forEach(sub => {
        const subtotal = sub.total / 1.18;
        const tax = sub.total - subtotal;
        const newInvoice = {
          id: 'inv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          invoiceNumber: 'INV-2026-' + Math.floor(1000 + Math.random() * 9000),
          subscriptionNumber: sub.num,
          customer: sub.customer,
          customerEmail: sub.customerEmail || 'billing@' + sub.customer.toLowerCase().replace(/[^a-z]/g, '') + '.com',
          billingAddress: 'Corporate Headquarters, Technology Park, Bengaluru',
          status: 'confirmed',
          invoiceDate: '2026-10-31',
          dueDate: '2026-11-15',
          paidDate: null,
          paymentMethod: null,
          paymentReference: null,
          lineItems: [
            { description: sub.plan + ' (Recurring Cycle)', quantity: 1, unitPrice: Math.round(subtotal), subtotal: Math.round(subtotal) }
          ],
          subtotal: Math.round(subtotal),
          discountType: 'percentage',
          discountValue: 0,
          discountAmount: 0,
          taxableAmount: Math.round(subtotal),
          taxRate: 18,
          taxAmount: Math.round(tax),
          totalAmount: Math.round(sub.total),
        };

        INVOICES_DATA.unshift(newInvoice);
        createdCount++;
      });

      showToast(`Generated ${createdCount} recurring invoice(s) from due active subscriptions.`);
      render();
    }

    function confirmInvoice(invoiceId) {
      INVOICES_DATA = INVOICES_DATA.map(inv => {
        if (inv.id === invoiceId) {
          return { ...inv, status: 'confirmed' };
        }
        return inv;
      });
      showToast('Invoice confirmed and published for payment settlement.');
      render();
    }

    function recordPaymentDirect(invoiceId, amount, method, refNumber) {
      const inv = INVOICES_DATA.find(i => i.id === invoiceId);
      if (!inv) return;

      const paymentDate = new Date().toISOString().split('T')[0];
      const newPayment = {
        id: 'pay_' + Date.now(),
        paymentNumber: 'PAY-2026-' + Math.floor(1000 + Math.random() * 9000),
        invoiceNumber: inv.invoiceNumber,
        customer: inv.customer,
        amount: Number(amount),
        paymentMethod: method,
        paymentDate: paymentDate,
        referenceNumber: refNumber || ('UTR-' + Date.now().toString().slice(-6)),
        status: 'settled',
        notes: `Remittance settled for ${inv.invoiceNumber}`,
      };

      PAYMENTS_DATA.unshift(newPayment);

      INVOICES_DATA = INVOICES_DATA.map(i => {
        if (i.id === invoiceId) {
          return {
            ...i,
            status: 'paid',
            paidDate: paymentDate,
            paymentMethod: method,
            paymentReference: newPayment.referenceNumber
          };
        }
        return i;
      });

      state.paymentModalInvoice = null;
      state.isSelectInvoiceModalOpen = false;
      showToast(`Payment of ₹${Number(amount).toLocaleString('en-IN')} reconciled. Invoice marked as Paid.`);
      render();
    }

    function showToast(msg) {
      state.toastMessage = msg;
      setTimeout(() => {
        state.toastMessage = null;
        render();
      }, 4500);
    }

      const paidInvoices = INVOICES_DATA.filter(i => i.status === 'paid');
      const totalCollected = paidInvoices.reduce((acc, c) => acc + (Number(c.totalAmount) || 0), 0);
      const outstandingInvoices = INVOICES_DATA.filter(i => i.status === 'confirmed');
      const totalOutstanding = outstandingInvoices.reduce((acc, c) => acc + (Number(c.totalAmount) || 0), 0);
      const overdueInvoices = INVOICES_DATA.filter(i => i.status === 'confirmed' && i.dueDate && new Date(i.dueDate) < new Date());

      const filtered = INVOICES_DATA.filter(inv => {
        const isOverdue = inv.status === 'confirmed' && inv.dueDate && new Date(inv.dueDate) < new Date();
        if (state.invoiceFilter === 'overdue' && !isOverdue) return false;
        if (state.invoiceFilter !== 'all' && state.invoiceFilter !== 'overdue' && inv.status !== state.invoiceFilter) return false;

        if (state.invoiceSearch.trim()) {
          const q = state.invoiceSearch.toLowerCase();
          const matchNum = inv.invoiceNumber?.toLowerCase().includes(q);
          const matchCust = inv.customer?.toLowerCase().includes(q);
          const matchSub = inv.subscriptionNumber?.toLowerCase().includes(q);
          return matchNum || matchCust || matchSub;
        }
        return true;
      });

            </div>

            <div class="w-full sm:w-72">
              <input type="text" placeholder="Search payment #, UTR, invoice..." value="${state.paymentSearch}" oninput="state.paymentSearch = this.value; render();" class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-100 font-mono focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            </div>
          </div>

          <!-- Payments Table -->
          <div class="border border-slate-800 rounded-xl bg-slate-900 overflow-hidden shadow-sm">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-950/70 border-b border-slate-800 text-slate-400 font-mono uppercase text-[11px] tracking-wider">
                <tr>
                  <th class="py-3 px-4">Payment #</th>
                  <th class="py-3 px-4">Invoice Ref</th>
                  <th class="py-3 px-4">Customer</th>
                  <th class="py-3 px-4">Method</th>
                  <th class="py-3 px-4">Settlement Date</th>
                  <th class="py-3 px-4">UTR / External Ref</th>
                  <th class="py-3 px-4 text-right">Settled Amount (₹)</th>
                  <th class="py-3 px-4 text-center">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                ${filtered.length === 0 ? `
                  <tr>
                    <td colSpan="8" class="py-10 text-center text-slate-500 font-mono">
                      No payment records match the current filter.
                    </td>
                  </tr>
                ` : filtered.map(p => `
                  <tr class="hover:bg-slate-800/40 transition-colors">
                    <td class="py-3.5 px-4 font-mono font-bold text-slate-200">
                      <span class="text-emerald-400 mr-1.5">✓</span>${p.paymentNumber}
                    </td>

                    <td class="py-3.5 px-4 font-mono text-indigo-400">
                      ${p.invoiceNumber}
                    </td>

                    <td class="py-3.5 px-4 font-semibold text-slate-200">
                      ${p.customer}
                    </td>

                    <td class="py-3.5 px-4">
                      <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-slate-800 text-slate-300 border border-slate-700">
                        ${p.paymentMethod}
                      </span>
                    </td>

                    <td class="py-3.5 px-4 font-mono text-slate-400">
                      ${p.paymentDate}
                    </td>

                    <td class="py-3.5 px-4 font-mono text-slate-300">
                      <span class="px-1.5 py-0.5 bg-slate-950 border border-slate-800 rounded text-[11px]">${p.referenceNumber}</span>
                    </td>

                    <td class="py-3.5 px-4 text-right font-mono font-bold text-emerald-400">
                      ₹${Number(p.amount).toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                    </td>

                    <td class="py-3.5 px-4 text-center">
                      <span class="px-2 py-0.5 rounded text-[10px] font-mono uppercase font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                        SETTLED
                      </span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
