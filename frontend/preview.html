        company: 'Brightloop Core Systems',
        department: 'Platform Engineering',
        allowedRoutes: ['dashboard', 'products', 'subscriptions', 'invoices', 'payments']
      },
      staff: {
        name: 'Alex Rivera',
        email: 'staff@brightloop.io',
        role: 'staff',
        company: 'Brightloop Operations',
        department: 'Billing Operations',
        allowedRoutes: ['dashboard', 'products', 'subscriptions', 'invoices', 'payments']
      },
      customer: {
        name: 'Elena Rostova',
        email: 'customer@acme.corp',
        role: 'customer',
        company: 'Acme Global Logistics',

    let state = {

      loginError: '',
      isRegisterMode: false,

      regEmail: '',
      regCompany: '',
      regRole: 'customer',
      regPassword: '',
      regConfirm: ''
    };

    const PRODUCTS_DATA = [
      {
        id: 'prod_01',
        name: 'Enterprise Cloud Core',
        type: 'SaaS Subscription',
        salesPrice: 32000,
        costPrice: 16500,
        notes: 'High-availability infrastructure with 99.99% uptime guarantee.',
        variants: [
          { name: 'Standard Edition', code: 'STD', delta: 0 },
          { name: 'Odoo Enterprise Connector Sync', code: 'ODOO-560', delta: 560 },
          { name: 'Dedicated VPS Cluster', code: 'VPS-4200', delta: 4200 },
        ]
      },
      {
        id: 'prod_02',
        name: 'Revenue Intelligence Platform',
        type: 'Service & Analytics',
        salesPrice: 14000,
        costPrice: 6200,
        notes: 'Cohort retention, churn prediction, and automated MRR engine.',
        variants: [
          { name: 'Standard Dashboard', code: 'STD', delta: 0 },
          { name: 'Odoo Invoicing Webhook', code: 'ODOO-560', delta: 560 },
          { name: 'Snowflake Pipeline Streamer', code: 'DW-1800', delta: 1800 },
        ]
      },
      {
        id: 'prod_03',
        name: 'API Gateway & Event Dispatcher',
        type: 'API Provisioning',
        salesPrice: 8000,
        costPrice: 3100,
        notes: 'Distributed webhooks, rate-limiting rules, token authorization.',
        variants: [
          { name: 'Standard Throughput', code: 'STD', delta: 0 },
          { name: 'Odoo REST / XML-RPC Bridge', code: 'ODOO-560', delta: 560 },
          { name: 'Unlimited Peak Burst', code: 'BURST-3000', delta: 3000 },
        ]
      }
    ];

    const PLANS_DATA = [
      { name: 'Enterprise Core — Daily Pass', product: 'Enterprise Cloud Core', freq: 'daily', price: 1500, mrr: 45000, status: 'active', subs: 8 },
      { name: 'Enterprise Core — Weekly Sprint', product: 'Enterprise Cloud Core', freq: 'weekly', price: 8000, mrr: 34666, status: 'active', subs: 24 },
      { name: 'Enterprise Core — Monthly Standard', product: 'Enterprise Cloud Core', freq: 'monthly', price: 32000, mrr: 32000, status: 'active', subs: 82 },
      { name: 'Enterprise Core — Annual Commitment', product: 'Enterprise Cloud Core', freq: 'yearly', price: 350000, mrr: 29166, status: 'active', subs: 16 },
      { name: 'Revenue Intelligence — Weekly', product: 'Revenue Intelligence Platform', freq: 'weekly', price: 3500, mrr: 15166, status: 'active', subs: 12 },
      { name: 'Revenue Intelligence — Monthly', product: 'Revenue Intelligence Platform', freq: 'monthly', price: 14000, mrr: 14000, status: 'active', subs: 45 },
      { name: 'API Gateway — Monthly', product: 'API Gateway & Event Dispatcher', freq: 'monthly', price: 8000, mrr: 8000, status: 'active', subs: 38 },
      { name: 'API Gateway — Yearly Enterprise', product: 'API Gateway & Event Dispatcher', freq: 'yearly', price: 85000, mrr: 7083, status: 'beta', subs: 4 },
    ];

    function setLoginRole(roleKey) {
      const p = PRESET_USERS[roleKey];
      if (p) {
        state.selectedLoginRole = roleKey;
        state.loginEmail = p.email;
        state.loginPassword = 'password123';
        state.loginError = '';
        render();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      state.isSubmitting = true;
      state.loginError = '';
      render();

      setTimeout(() => {
        const assignedRole = state.selectedLoginRole;
        const preset = PRESET_USERS[assignedRole];
        const profile = {
          name: state.loginEmail.split('@')[0].replace('.', ' ').replace(/\b\w/g, l => l.toUpperCase()),
          email: state.loginEmail,
          role: assignedRole,
          company: preset ? preset.company : 'Brightloop Software',
          department: preset ? preset.department : 'General Access',
          allowedRoutes: assignedRole === 'customer' 
            ? ['dashboard', 'subscriptions', 'invoices']
            : ['dashboard', 'products', 'subscriptions', 'invoices', 'payments']
        };
        const token = 'jwt_token_' + assignedRole + '_' + Date.now();

        localStorage.setItem('token', token);
        localStorage.setItem('user_role', assignedRole);
        localStorage.setItem('user_profile', JSON.stringify(profile));

        state.token = token;
        state.role = assignedRole;
        state.user = profile;
        state.isSubmitting = false;
        state.activeTab = 'dashboard';
        render();
      }, 200);
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user_role');
      localStorage.removeItem('user_profile');

      state.token = null;
      state.role = null;
      state.user = null;
      state.activeTab = 'dashboard';
      render();
    }

    function setActiveTab(tab) {
      if (state.user && !state.user.allowedRoutes.includes(tab)) {
        alert('Access Restricted: Your assigned role (' + state.role + ') does not have access to this module.');
        return;
      }
      state.activeTab = tab;
      render();
    }

    function render() {
      const app = document.getElementById('app');
      const isAuthenticated = !!state.token && !!state.user && !!state.role;

      if (!isAuthenticated) {
        app.innerHTML = renderLoginScreen();
      } else {
        app.innerHTML = renderAppShell();
      }
    }

    function renderLoginScreen() {
      return `

                  <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="setLoginRole('admin')" class="p-2 rounded-lg border text-left text-xs transition-all ${state.selectedLoginRole === 'admin' ? 'border-indigo-500 bg-indigo-500/10 text-white ring-1 ring-indigo-500' : 'border-slate-800 bg-slate-950/60 text-slate-400 hover:border-slate-700 hover:text-slate-200'}">
                      <div class="font-semibold text-slate-200">Admin</div>
                      <div class="text-xs text-slate-400">Full Access</div>
                    </button>
                    <button type="button" onclick="setLoginRole('staff')" class="p-2 rounded-lg border text-left text-xs transition-all ${state.selectedLoginRole === 'staff' ? 'border-indigo-500 bg-indigo-500/10 text-white ring-1 ring-indigo-500' : 'border-slate-800 bg-slate-950/60 text-slate-400 hover:border-slate-700 hover:text-slate-200'}">

                      <div class="text-xs text-slate-400">Billing Ops</div>

                    <button type="button" onclick="setLoginRole('customer')" class="p-2 rounded-lg border text-left text-xs transition-all ${state.selectedLoginRole === 'customer' ? 'border-indigo-500 bg-indigo-500/10 text-white ring-1 ring-indigo-500' : 'border-slate-800 bg-slate-950/60 text-slate-400 hover:border-slate-700 hover:text-slate-200'}">
                      <div class="font-semibold text-slate-200">Customer</div>

              <form onsubmit="handleLogin(event)" class="space-y-4">

                  <label class="block text-xs font-medium text-slate-300 mb-1">Corporate Email</label>
                  <input type="email" required value="${state.loginEmail}" oninput="state.loginEmail = this.value" class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono" />
                </div>

                <div>
                  <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-medium text-slate-300">Password</label>
                    <span class="text-xs font-mono text-slate-400">Default: <span class="text-indigo-400">password123</span></span>
                  </div>
                  <input type="password" required value="${state.loginPassword}" oninput="state.loginPassword = this.value" class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono" />

                </div>

            </div>
            <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-800 text-xs">
              <button onclick="state.productsSubTab = 'products'; render();" class="px-3 py-1.5 rounded-md font-medium transition-all ${state.productsSubTab === 'products' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">
                Master Products (${PRODUCTS_DATA.length})
              </button>
              <button onclick="state.productsSubTab = 'plans'; render();" class="px-3 py-1.5 rounded-md font-medium transition-all ${state.productsSubTab === 'plans' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">
                Billing Plans (${PLANS_DATA.length})
              </button>
            </div>
          </div>

          ${state.productsSubTab === 'products' ? `
            <div class="border border-slate-800 rounded-xl bg-slate-900 overflow-hidden shadow-sm">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-950/70 border-b border-slate-800 text-slate-400 font-mono uppercase text-[11px]">
                  <tr>
                    <th class="py-3 px-4">Product Name</th>
                    <th class="py-3 px-4">Type</th>
                    <th class="py-3 px-4">Sales Price</th>
                    <th class="py-3 px-4">Cost Price</th>
                    <th class="py-3 px-4">Margin</th>
                    <th class="py-3 px-4">Configured Variants (Deltas)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${PRODUCTS_DATA.map(p => {
                    const margin = Math.round(((p.salesPrice - p.costPrice) / p.salesPrice) * 100);
                    return `
                      <tr class="hover:bg-slate-800/40">
                        <td class="py-3 px-4">
                          <div class="font-semibold text-slate-100">${p.name}</div>
                          <div class="text-[11px] text-slate-400 truncate max-w-xs">${p.notes}</div>
                        </td>
                        <td class="py-3 px-4"><span class="font-mono text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${p.type}</span></td>
                        <td class="py-3 px-4 font-mono font-bold text-white">₹${p.salesPrice.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-4 font-mono text-slate-400">₹${p.costPrice.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-4 font-mono text-emerald-400 font-semibold">${margin}%</td>
                        <td class="py-3 px-4">
                          <div class="flex flex-wrap gap-1.5">
                            ${p.variants.map(v => `
                              <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-mono border ${v.delta > 0 ? 'bg-indigo-500/10 text-indigo-300 border-indigo-500/30 font-semibold' : 'bg-slate-800 text-slate-400 border-slate-700'}">
                                ${v.name}: ${v.delta === 0 ? '+₹0' : '+₹' + v.delta}
                              </span>
                            `).join('')}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="border border-slate-800 rounded-xl bg-slate-900 overflow-hidden shadow-sm">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-950/70 border-b border-slate-800 text-slate-400 font-mono uppercase text-[11px]">
                  <tr>
                    <th class="py-3 px-4">Plan Name</th>
                    <th class="py-3 px-4">Billing Frequency</th>
                    <th class="py-3 px-4">Price</th>
                    <th class="py-3 px-4">MRR Equiv.</th>
                    <th class="py-3 px-4">Availability</th>
                    <th class="py-3 px-4">Subscribers</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${PLANS_DATA.map(pl => `
                    <tr class="hover:bg-slate-800/40">
                      <td class="py-3 px-4">
                        <div class="font-semibold text-slate-100">${pl.name}</div>
                        <div class="text-[11px] text-slate-400 font-mono">${pl.product}</div>
                      </td>
                      <td class="py-3 px-4 capitalize font-mono text-indigo-400 font-medium">${pl.freq}</td>
                      <td class="py-3 px-4 font-mono font-bold text-white">₹${pl.price.toLocaleString('en-IN')} <span class="text-[10px] text-slate-400 font-normal">/${pl.freq}</span></td>
                      <td class="py-3 px-4 font-mono text-emerald-400 font-semibold">₹${pl.mrr.toLocaleString('en-IN')}/mo</td>
                      <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-[10px] font-mono uppercase ${pl.status === 'active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">${pl.status}</span></td>
                      <td class="py-3 px-4 font-mono text-slate-300">${pl.subs} active</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
